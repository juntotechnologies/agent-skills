# Lint rules for the site-taste skill code and its tests. The older scripts in
# this repository are not covered yet. tests/test_site_taste_shape.py adds the
# checks ruff does not have: no nested functions and no lambdas.
required-version = "==0.17.0"
target-version = "py312"
line-length = 130
preview = true
include = ["skills/site-taste/**/*.py", "tests/test_site_taste*.py"]

[lint]
explicit-preview-rules = true
select = [
  "E", "F", "W",   # pycodestyle and pyflakes
  "B",             # bugbear
  "I",             # import order
  "C90",           # cyclomatic complexity
  "PLR0911",       # too many returns
  "PLR0912",       # too many branches
  "PLR0913",       # too many arguments
  "PLR0915",       # too many statements
  "PLR1702",       # too deeply nested blocks
  "E731",          # lambda assigned to a name
]

[lint.mccabe]
max-complexity = 5

[lint.pylint]
max-statements = 15
max-branches = 4
max-returns = 4
max-args = 4
max-nested-blocks = 1
